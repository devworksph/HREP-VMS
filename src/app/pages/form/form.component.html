<div class="forms">
    <div class="logos">
        <a routerLink="/">
          <img
            *ngIf="location == 'The Legislative Museum of the House of Representatives' || location == 'Library, Archives and The House'"
            src="../assets/images/the-house-logo-white.png" 
            alt="The House" />
          <img
            *ngIf="location == 'Library and Archives' || location == 'Library, Archives and The House'"
            src="../assets/images/library-archives-the-house.svg"
            alt="Library and Archives" />
          
        </a>
    </div>
    <museum-form
        [location]="location"
        [locationContactNo]="locationContactNo"
        [locationEmail]="locationEmail"
    ></museum-form>
    <div class="footer">
        <span class="x">
          <i class="fa-brands fa-x-twitter"></i>
          <a href="https://x.com/{{ xAccount }}" target="_blank">
            &#64;{{ xAccount }}
          </a>
        </span>
        <span class="email">
          <i class="fa-solid fa-envelope"></i>
          <a href="mailto:{{ locationEmail }}">
            {{ locationEmail }}
          </a>
        </span>
        <span class="phone">
          <i class="fa-solid fa-phone"></i>
          {{ locationContactNo }}
        </span>
        <span
          *ngIf="tiktokAccount"
          class="tiktok">
          <i class="fa-brands fa-tiktok"></i>
          <a href="https://www.tiktok.com/@{{ tiktokAccount }}" target="_blank">
            &#64;{{ tiktokAccount }}
          </a>
        </span>
        <span
          *ngIf="fbAccount"
          class="facebook">
          <i class="fa-brands fa-facebook"></i>
          <a href="https://www.facebook.com/{{ fbAccount }}" target="_blank">
            &#64;{{ fbAccount }}
          </a>
        </span>
    </div>
</div>
